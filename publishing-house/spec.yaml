project:
  slug: "ph-openshift-autoshift"
  owner_email: "psrivast@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "migration"
  automation_type: "both"
  description: "Hands-on workshop teaching platform engineers to govern OpenShift clusters at scale using Red Hat ACM, OpenShift GitOps (Argo CD), and the AutoShift IaC framework. 10 modules (~4 hours) progress from hub bootstrap through fleet operations.  Participants learn to manage fleet-wide configuration through a label-driven policy model: enabling operators with labels alone, authoring PolicyGenerator policies, publishing to OCI registries (including disconnected environments), and provisioning AWS spoke clusters that inherit configuration automatically.  Key topics: ACM + GitOps bootstrap, label-driven operator management, per-cluster config overrides, custom PolicyGenerator authoring with Kustomize, OCI publishing via Red Hat Quay, gradual rollout strategies, hub-of-hubs patterns, and spoke cluster lifecycle.  AWS is required — the lab provisions a real AWS spoke cluster to demonstrate multi-cluster fleet management, and the hub runs ODF (NooBaa MCG) on AWS storage.  Technologies: OpenShift, ACM, Argo CD, Helm, OLM/OperatorPolicy, PolicyGenerator, Quay, ODF, AWS.  Target: Platform engineers and SREs. Intermediate pace — assumes comfort with OpenShift, Helm, and Git."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "GPTEINFRA-17684"
  workflow_id: "b3990762-374f-4dd1-98c2-16b827868a7a"

spec:
  title: "Getting to know AutoShift"
  learning_objectives:
    - "Bootstrap Red Hat ACM, OpenShift GitOps, and AutoShift on a hub cluster and explain the three-phase deployment model"
    - "Trace the label flow from a values file through a ConfigMap to a ManagedCluster label and explain how Placements use those labels to dispatch policies"
    - "Enable, pin, and disable operators fleet-wide using the 5-label operator contract without modifying any policy code"
    - "Author a new PolicyGenerator policy using the generator script, render it locally, and pass the integration test"
    - "Publish AutoShift to an OCI registry and redeploy from it, and flip the fleet to mirrored catalog sources for disconnected environments"
  modules:
    - id: module-01
      title: "Bootstrap AutoShift"
      duration_min: 30
      status: not_started
    - id: module-02
      title: "Trace the label flow"
      duration_min: 20
      status: not_started
    - id: module-03
      title: "Start the long-running builds"
      duration_min: 20
      status: not_started
    - id: module-04
      title: "Enable a feature with labels alone"
      duration_min: 30
      status: not_started
    - id: module-05
      title: "Config blocks and per-cluster overrides"
      duration_min: 20
      status: not_started
    - id: module-06
      title: "Operate and troubleshoot"
      duration_min: 30
      status: not_started
    - id: module-07
      title: "Author a PolicyGenerator policy"
      duration_min: 30
      status: not_started
    - id: module-08
      title: "OCI publishing and disconnected environments"
      duration_min: 30
      status: not_started
    - id: module-09
      title: "Fleet operations capstone"
      duration_min: 20
      status: not_started
    - id: module-10
      title: "Your spoke cluster joined the fleet"
      duration_min: 15
      status: not_started
  environment:
    platform: "ocp"
    topology: "per-student"
    cloud_provider: aws
    max_concurrent_users: null

    # --- OCP-specific fields (only when platform = ocp) ---
    # Compact topology: 3x m5a.8xlarge (32 vCPU, 128 GB RAM) — schedulable control plane, no dedicated workers
    ocp_version: "4.22"
    cluster_type: "compact"
    control_plane_instance_count: 3
    control_plane_cpu: 32
    control_plane_ram_gb: 128
