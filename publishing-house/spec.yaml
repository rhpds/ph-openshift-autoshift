# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: true
    assessment_strategy: "Each module includes verify steps with specific oc commands that confirm expected state. The showroom provides solve and validate buttons per exercise. Validation is command-output-based (ArgoCD Application health, policy compliance status, ConfigMap contents, OperatorPolicy state) rather than trust-based."
    catalog_gap: ""
    design_overview: "Hands-on workshop teaching platform engineers to govern OpenShift clusters at scale using Red Hat ACM, OpenShift GitOps, and the AutoShift IaC framework. Participants bootstrap a hub cluster and work through 10 progressive modules — from label-flow tracing and operator lifecycle management to OCI publishing and multi-cluster fleet operations — with a real AWS spoke cluster provisioned midway. The lab's label-driven policy model (values file → ConfigMap → ManagedCluster labels → Placement → Policy) is the unifying teaching thread across all modules."
    module_summaries:
      - title: "Bootstrap AutoShift"
        overview: "Participants bootstrap ACM, OpenShift GitOps, and the AutoShift Helm chart in dependency order, then verify the ApplicationSet auto-discovers all policy directories and creates per-policy Argo CD Applications."
      - title: "Trace the label flow"
        overview: "Starting with all policies deployed but no cluster assigned, participants assign the hub clusterset and trace the full chain from values file to ManagedCluster label stamp to policy Compliance, then prove that removing a label propagates deletion."
      - title: "Start the long-running builds"
        overview: "Using only labels and values files, participants declare a NooBaa MCG object store, a Quay registry, and a full SNO spoke cluster on AWS, then leave them to build while continuing the workshop."
      - title: "Enable a feature with labels alone"
        overview: "Participants enable, version-pin, and disable Node Feature Discovery using the 5-label operator contract, tracing every hop from label to running OLM Subscription and discovering the subtlety of split upgrade-approval semantics."
      - title: "Config blocks and per-cluster overrides"
        overview: "Participants add a structured config block for User Workload Monitoring and apply a per-cluster override, learning when labels are insufficient and how cluster-level values win over clusterset defaults."
      - title: "Operate and troubleshoot"
        overview: "Participants walk a 5-layer diagnostic chain on a healthy policy, flip the fleet-wide dry-run safety switch, and introduce a deliberate break to discover that missing labels can cause silent drift instead of immediate policy failures."
      - title: "Author a PolicyGenerator policy"
        overview: "Participants scaffold a new operator policy for the Web Terminal Operator using the generator script, render it locally with kustomize and the PolicyGenerator plugin, and fix 6 missing label contract entries revealed by the integration test."
      - title: "OCI publishing and disconnected environments"
        overview: "Participants pre-render PolicyGenerator directories into Helm charts, publish them to an OCI registry, and flip the fleet to mirrored catalog sources by adding two labels — understanding how the disconnected imageset generator reads subscription-name labels."
      - title: "Fleet operations capstone"
        overview: "A synthesis module covering gradual rollout via versioned clustersets, declarative cluster assignment, the 4-policy OpenShift upgrade pipeline, hub-of-hubs topology, and the production values-in-separate-repo deployment model."
      - title: "Your spoke cluster joined the fleet"
        overview: "Participants observe the AWS SNO spoke cluster that was started in Module 3 join the fleet, confirm ACM auto-applied all labels and policies, then execute the two-step mandatory teardown to stop billing."
    rcars_overlap_pct: 95
    rcars_top_matches:
      - title: "Hands-on lab with Red Hat OpenShift Platform Plus (2025)"
        ci_name: "sandboxes-gpte.opp-hol.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.opp-hol.prod"
        relevance_score: 95
        why_it_fits: "This lab directly covers the core technologies in the request — RHACM, OpenShift GitOps/ArgoCD, PolicyGenerator, and Red Hat Quay — with a dedicated module on Policy-Driven Governance and hands-on use of the Policy Generator tool for fleet-wide policy authoring."
        workloads: []
      - title: "Advanced Cluster Management for Kubernetes Demo"
        ci_name: "published.ocp4-acm-demo.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.ocp4-acm-demo.prod"
        relevance_score: 95
        why_it_fits: "This lab directly covers RHACM governance policies, PolicyGenerator with Kustomize, ArgoCD ApplicationSets for multicluster GitOps, and operator policy enforcement across a managed cluster fleet — all core topics of the request."
        workloads:
          - role: "ocp4_workload_rhacm"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_showroom"
            collection: "agnosticd.showroom"
      - title: "Sovereign Cloud Architecture with OpenShift: Multi-Cluster Data Residency and Compliance Management"
        ci_name: "published.sovereign-cloud-lab.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.sovereign-cloud-lab.prod"
        relevance_score: 74
        why_it_fits: "This lab covers several overlapping technologies including RHACM multi-cluster management, OpenShift GitOps with Argo CD, policy-as-code governance with label-based cluster targeting, and Red Hat Quay — all core to the requested fleet governance use case."
        workloads:
          - role: "ocp4_workload_cert_manager"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_external_odf"
            collection: "agnosticd.core_workloads"
    catalog_gap: "No existing catalog item teaches the AutoShift IaC framework's label-driven config model (values file → ConfigMap → ManagedCluster labels → Placement → Policy), hands-on PolicyGenerator policy scaffolding with a 5-stage integration test, or pre-rendering policies as Helm charts for OCI publishing and disconnected fleet deployment. Existing ACM labs cover governance broadly but treat PolicyGenerator as a consumer tool, not something authors extend."
    rejections: []

  infra:
