    worker_ram_gb: null
    worker_disk_gb: null

    # --- VM-specific fields (only when platform = rhel-vms) ---
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""
    ai_requirement: "none"
    ai_model_tier: ""
    ai_model_name: ""
    ai_justification: ""
    non_ga_products: []
    non_ga_access_plan: ""
    external_services:
      - "github.com"
      - "quay.io"
    gpu_nodes: 0
    gpu_type: ""
  duration_hours: 4.1
  audience: "intermediate"

