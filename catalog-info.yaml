metadata:
  name: ph-openshift-autoshift
  title: ph-openshift-autoshift
  description: "Hands-on workshop teaching platform engineers to govern OpenShift\
    \ clusters at scale using Red Hat ACM, OpenShift GitOps (Argo CD), and the AutoShift\
    \ IaC framework. 10 modules (~4 hours) progress from hub bootstrap through fleet\
    \ operations.  Participants learn to manage fleet-wide configuration through a\
    \ label-driven policy model: enabling operators with labels alone, authoring PolicyGenerator\
    \ policies, publishing to OCI registries (including disconnected environments),\
    \ and provisioning AWS spoke clusters that inherit configuration automatically.\
    \  Key topics: ACM + GitOps bootstrap, label-driven operator management, per-cluster\
    \ config overrides, custom PolicyGenerator authoring with Kustomize, OCI publishing\
    \ via Red Hat Quay, gradual rollout strategies, hub-of-hubs patterns, and spoke\
    \ cluster lifecycle.  AWS is required \u2014 the lab provisions a real AWS spoke\
    \ cluster to demonstrate multi-cluster fleet management, and the hub runs ODF\
    \ (NooBaa MCG) on AWS storage.  Technologies: OpenShift, ACM, Argo CD, Helm, OLM/OperatorPolicy,\
    \ PolicyGenerator, Quay, ODF, AWS.  Target: Platform engineers and SREs. Intermediate\
    \ pace \u2014 assumes comfort with OpenShift, Helm, and Git."
